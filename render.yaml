services:
  - type: web
    name: christmas-snowball
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: SERVER_NAME
        value: 눈마을
      - key: SERVER_COUNT
        value: "3"
      - key: MAX_PER_SERVER
        value: "500"
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false
