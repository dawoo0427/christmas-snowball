<title>크리스마스 눈싸움 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* 레이아웃: 화면 전체 3D 캔버스 위에 HUD를 띄우는 단일 화면 게임. 밤 겨울 마을의 단일(다크) 테마 */
  :root {
    --night: #0d1630; --panel: #0b1430c8; --ink: #f4f7ff; --muted: #cfe0ff;
    --gold: #ffd34d; --red: #e53935; --red-dark: #8e1c1a; --mint: #7dffb0; --sky: #7dd3ff; --heart: #ff4d6d;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --body: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--night); color:var(--ink); font-family:var(--body);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .panel { position:fixed; pointer-events:none; text-shadow:0 2px 4px #0009; }
  #stats { left:calc(14px + env(safe-area-inset-left,0px)); top:calc(12px + env(safe-area-inset-top,0px)); }
  #hearts { font-size:26px; letter-spacing:2px; color:var(--heart); line-height:1; }
  #hearts .off { opacity:.25; color:#fff; }
  #ammo { margin-top:6px; display:flex; gap:5px; align-items:center; flex-wrap:wrap; max-width:220px; }
  #ammo i { width:13px; height:13px; border-radius:50%; background:#fff; box-shadow:0 0 4px #9cf; display:inline-block; }
  #ammo i.off { background:#ffffff30; box-shadow:none; }
  #ammo span { font-size:13px; margin-left:4px; color:var(--muted); }
  #buffs { margin-top:6px; font-size:14px; font-family:var(--display); display:flex; flex-direction:column; gap:2px; }
  #objective { left:50%; top:calc(10px + env(safe-area-inset-top,0px)); transform:translateX(-50%); text-align:center; background:var(--panel);
    padding:7px 16px; border-radius:14px; border:1px solid #ffffff25; font-family:var(--display); font-size:17px; max-width:min(440px, 56vw); }
  #objective b { color:var(--gold); }
  #objective small { display:block; color:var(--muted); font-family:var(--body); font-size:12px; margin-top:2px; }
  #scorebox { right:calc(14px + env(safe-area-inset-right,0px)); top:calc(200px + env(safe-area-inset-top,0px)); text-align:right; }
  #score { font-size:26px; font-family:var(--display); }
  #combo { color:var(--mint); font-family:var(--display); font-size:18px; min-height:22px; }
  #team { font-size:13px; color:var(--muted); line-height:1.5; }
  #mini { position:fixed; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(10px + env(safe-area-inset-top,0px)); width:180px; height:180px;
    border-radius:14px; border:2px solid #ffffff50; background:#0b1430; pointer-events:none; }
  #toast { left:50%; top:26%; transform:translateX(-50%); text-align:center; font-family:var(--display); font-size:40px; color:var(--gold); opacity:0; transition:opacity .3s; white-space:nowrap; }
  #toast small { display:block; font-size:18px; color:#fff; margin-top:4px; }
  #help { left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); font-size:12px; color:#cfe0ffcc; line-height:1.6; }
  #respawn { left:50%; top:45%; transform:translate(-50%,-50%); font-family:var(--display); font-size:30px; text-align:center; display:none; }
  #hurt { position:fixed; inset:0; pointer-events:none; box-shadow: inset 0 0 160px #ff2040; opacity:0; transition:opacity .15s; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .hp { position:absolute; width:46px; height:6px; margin-left:-23px; background:#0009; border-radius:3px; overflow:hidden; }
  .hp i { display:block; height:100%; background:linear-gradient(90deg,#ff5252,#ff8a65); }
  .hp.boss { width:110px; margin-left:-55px; height:9px; }
  .pop { position:absolute; transform:translate(-50%,-50%); font-family:var(--display); font-size:21px; text-shadow:0 2px 3px #000a; white-space:nowrap; }
  .tag { position:absolute; transform:translate(-50%,-100%); font-family:var(--display); font-size:14px; padding:1px 8px; border-radius:9px; background:#0008; white-space:nowrap; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#050a1cd9; z-index:5; text-align:center;
    padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
    overflow:auto; user-select:text; -webkit-user-select:text; }
  #overlay.hidden { display:none; }
  #overlay > div { max-width:640px; width:100%; margin:auto; }
  #overlay h1 { font-family:var(--display); font-weight:400; font-size:clamp(30px,7vw,58px); margin:0 0 6px; letter-spacing:1px; }
  #overlay h2 { color:var(--gold); font-family:var(--body); font-size:clamp(14px,2.4vw,19px); font-weight:700; margin:0 0 18px; line-height:1.55; text-wrap:balance; }
  #overlay .keys { display:grid; grid-template-columns:auto 1fr; gap:5px 16px; text-align:left; margin:0 auto 18px; width:max-content; max-width:100%; font-size:14px; color:#e6eeff; }
  #overlay .keys b { color:var(--sky); white-space:nowrap; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  #overlay button { font-family:var(--display); font-size:20px; padding:11px 26px; border-radius:30px; border:none; background:var(--red); color:#fff; cursor:pointer; box-shadow:0 4px 0 var(--red-dark); }
  #overlay button.alt { background:#2f6fd6; box-shadow:0 4px 0 #1a3f80; }
  #overlay button.ghost { background:#ffffff1c; box-shadow:none; font-size:16px; }
  #overlay button:disabled { opacity:.45; cursor:default; }
  #overlay button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--red-dark); }
  #overlay button:focus-visible, #overlay input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  #overlay input { font-family:var(--display); font-size:20px; padding:9px 14px; border-radius:14px; border:2px solid #ffffff40; background:#0b1430; color:#fff; text-align:center; width:200px; max-width:100%; }
  #overlay .row { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin:8px 0; }
  #overlay .note { color:var(--muted); font-size:13px; line-height:1.6; }
  #overlay .code { font-family:var(--display); font-size:56px; letter-spacing:10px; color:var(--gold); margin:4px 0; }
  #overlay .plist { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0; }
  #overlay .plist span { font-family:var(--display); padding:6px 14px; border-radius:16px; background:#ffffff18; }
  #overlay .stat { font-size:19px; margin:6px 0; }
  #overlay .err { color:#ff8a8a; font-size:14px; min-height:20px; }
  .swatch { display:inline-flex; gap:6px; }
  .swatch label { width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; }
  .swatch input { position:absolute; opacity:0; width:1px; height:1px; }
  .swatch input:checked + label { border-color:#fff; }
  .swatch input:focus-visible + label { outline:3px solid var(--gold); }
  #touch { display:none; }
  .joy { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:#ffffff14; border:2px solid #ffffff40; pointer-events:none; display:none; }
  .joy i { position:absolute; left:33px; top:33px; width:50px; height:50px; border-radius:50%; background:#ffffff70; }
  #joyR { border-color:#ff8a8a80; } #joyR i { background:#ff8a8aa0; }
  #tbtns { position:fixed; right:calc(12px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; }
  #tbtns button, #camBtns button { width:58px; height:58px; border-radius:50%; border:2px solid #ffffff70; background:#ffffff22; color:#fff; font-family:var(--display); font-size:15px; touch-action:none; }
  #camBtns { position:fixed; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(136px + env(safe-area-inset-top,0px)); display:flex; gap:8px; }
  #camBtns button { width:44px; height:44px; font-size:20px; }
  #thint { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); font-size:12px; color:#cfe0ffaa; pointer-events:none; white-space:nowrap; }
  body.touch #help { display:none; }
  body.touch.playing #touch { display:block; }
  body.touch #mini { width:120px; height:120px; }
  body.touch #scorebox { top:calc(186px + env(safe-area-inset-top,0px)); }
  body.touch #objective { font-size:14px; padding:5px 12px; }
  body.touch #hearts { font-size:21px; }
  body.touch #toast { font-size:28px; }
  body.touch #tbtns { flex-direction:row; }
  @media (max-height:520px) {
    #overlay h1 { font-size:30px; }
    #overlay h2 { font-size:13px; margin-bottom:10px; }
    #overlay .keys { font-size:12px; gap:2px 12px; }
    #overlay button { font-size:17px; padding:8px 20px; }
    #overlay input { font-size:17px; padding:6px 12px; }
    #overlay .code { font-size:40px; }
    #overlay .row, .btns { margin:5px 0; }
    #tbtns button { width:52px; height:52px; font-size:14px; }
    #camBtns button { width:38px; height:38px; font-size:17px; }
    body.touch #camBtns { top:calc(134px + env(safe-area-inset-top,0px)); }
    body.touch #scorebox { top:calc(178px + env(safe-area-inset-top,0px)); }
    body.touch #score { font-size:20px; }
    #toast { font-size:24px !important; top:20%; }
    #toast small { font-size:14px; }
  }
  @media (max-width:640px) { #objective small { display:none; } #toast { font-size:28px; } #thint { display:none; } }
  @media (prefers-reduced-motion: reduce) { #toast, #hurt { transition:none; } }
</style>

<canvas id="game"></canvas>
<div id="labels"></div>
<div id="hurt"></div>
<div class="panel" id="stats"><div id="hearts"></div><div id="ammo"></div><div id="buffs"></div></div>
<div class="panel" id="objective"></div>
<canvas id="mini" width="180" height="180"></canvas>
<div class="panel" id="scorebox"><div id="score">0</div><div id="combo"></div><div id="team"></div></div>
<div class="panel" id="toast"></div>
<div class="panel" id="respawn"></div>
<div class="panel" id="help">
  WASD 이동 · Shift 대시 · Space 점프 · 마우스 조준<br>
  좌클릭 던지기(꾹 누르면 강한 눈덩이) · R 재장전<br>
  Q/E 또는 우클릭 드래그 카메라 회전 · 휠 줌 · M 음악 · P 일시정지
</div>
<div id="touch">
  <div class="joy" id="joyL"><i></i></div>
  <div class="joy" id="joyR"><i></i></div>
  <div id="camBtns"><button data-b="camL" aria-label="카메라 왼쪽으로 돌리기">⟲</button><button data-b="camR" aria-label="카메라 오른쪽으로 돌리기">⟳</button></div>
  <div id="tbtns"><button data-b="jump">점프</button><button data-b="dash">대시</button><button data-b="reload">장전</button></div>
  <div id="thint">왼쪽: 이동 · 오른쪽 드래그: 조준 후 떼면 던지기 · 톡 치면 자동 조준</div>
</div>
<div id="overlay"><div><h1>🎄 크리스마스 눈싸움 3D</h1><h2>눈마을을 불러오는 중…</h2></div></div>

<script src="lib/three.min.js"></script>
<script>
(() => {
'use strict';
function boot() {
  if (window.THREE) return init();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';
  s.onload = init;
  s.onerror = () => { document.getElementById('overlay').innerHTML = '<div><h1>3D 엔진을 불러오지 못했어요</h1><h2>인터넷 연결을 확인하고 페이지를 새로고침해 주세요.</h2></div>'; };
  document.head.appendChild(s);
}

function init() {
// ============================================================
//  기본 유틸
// ============================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = t => t * t * (3 - 2 * t);
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const angLerp = (a, b, t) => a + angDiff(a, b) * t;
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
let seed = 20261225;
function srand() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const sr = (a, b) => a + srand() * (b - a);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (isTouch) document.body.classList.add('touch');

// ============================================================
//  월드 정의 (모든 플레이어가 같은 시드로 같은 월드를 만든다)
// ============================================================
const LIMIT = 112;
const VILLAGE = { safe: 28 };
const CAMPS = [
  { x: 55,  z: -40, name: '얼음 언덕 캠프',    snow: 2, peng: 0 },
  { x: -62, z: -42, name: '소나무 숲 캠프',    snow: 3, peng: 1 },
  { x: -66, z: 52,  name: '꽁꽁 호수 캠프',    snow: 3, peng: 2 },
  { x: 62,  z: 58,  name: '눈보라 골짜기 캠프', snow: 4, peng: 3 },
  { x: 0,   z: -92, name: '눈사람 왕의 요새',  snow: 3, peng: 2, boss: true },
];
const LAKE = { x: -24, z: 70, r: 15 };
function baseH(x, z) {
  return 2.2 * Math.sin(x * 0.045) * Math.cos(z * 0.04) + 0.9 * Math.sin(x * 0.12 + z * 0.08)
       + 1.1 * Math.cos(z * 0.1 - x * 0.035) + 0.45 * Math.sin(x * 0.3) * Math.sin(z * 0.27);
}
const FLATS = [
  { x: 0, z: 0, inner: 32, outer: 44 },
  ...CAMPS.map(c => ({ x: c.x, z: c.z, inner: c.boss ? 19 : 14, outer: c.boss ? 30 : 23 })),
  { x: LAKE.x, z: LAKE.z, inner: LAKE.r + 1, outer: LAKE.r + 10, lower: -1.4 },
];
FLATS.forEach(f => f.h = baseH(f.x, f.z) + (f.lower || 0));
function heightAt(x, z) {
  let h = baseH(x, z);
  for (const f of FLATS) {
    const d = Math.hypot(x - f.x, z - f.z);
    if (d < f.outer) { const t = smooth(clamp((d - f.inner) / (f.outer - f.inner), 0, 1)); h = f.h + (h - f.h) * t; }
  }
  const e = Math.max(Math.abs(x), Math.abs(z));
  if (e > 108) { const k = e - 108; h += k * k * 0.06 + k * 0.35; }
  return h;
}
const PATHS = CAMPS.map(c => [0, 0, c.x, c.z]);
function pathDist(x, z) {
  let best = 1e9;
  for (const [ax, az, bx, bz] of PATHS) {
    const dx = bx - ax, dz = bz - az, t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
    best = Math.min(best, Math.hypot(x - ax - dx * t, z - az - dz * t));
  }
  return best;
}
const onIce = (x, z) => Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r;
const inVillage = (x, z) => Math.hypot(x, z) < VILLAGE.safe;

// ============================================================
//  충돌체 (공간 격자). 박스 rot = 메쉬 rotation.y
// ============================================================
const CELL = 10, grid = new Map();
function addCollider(c) {
  c.base = heightAt(c.x, c.z) - 0.5;
  const r = c.t === 'c' ? c.r : Math.hypot(c.hw, c.hd);
  for (let ix = Math.floor((c.x - r - 2) / CELL); ix <= Math.floor((c.x + r + 2) / CELL); ix++)
    for (let iz = Math.floor((c.z - r - 2) / CELL); iz <= Math.floor((c.z + r + 2) / CELL); iz++) {
      const k = ix + ',' + iz; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(c);
    }
}
const nearby = (x, z) => grid.get(Math.floor(x / CELL) + ',' + Math.floor(z / CELL)) || [];
function pushOut(o, r) {
  for (const c of nearby(o.x, o.z)) {
    if (c.t === 'c') {
      const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), m = r + c.r;
      if (d < m && d > 1e-5) { o.x = c.x + dx / d * m; o.z = c.z + dz / d * m; }
    } else {
      const cs = Math.cos(c.rot), sn = Math.sin(c.rot), dx = o.x - c.x, dz = o.z - c.z;
      let lx = cs * dx - sn * dz, lz = sn * dx + cs * dz;
      const qx = clamp(lx, -c.hw, c.hw), qz = clamp(lz, -c.hd, c.hd);
      const ex = lx - qx, ez = lz - qz, d = Math.hypot(ex, ez);
      if (d < r) {
        if (d > 1e-5) { lx = qx + ex / d * r; lz = qz + ez / d * r; }
        else { const px = c.hw - Math.abs(lx), pz = c.hd - Math.abs(lz); if (px < pz) lx = Math.sign(lx || 1) * (c.hw + r); else lz = Math.sign(lz || 1) * (c.hd + r); }
        o.x = c.x + cs * lx + sn * lz; o.z = c.z - sn * lx + cs * lz;
      }
    }
  }
}
function hitsCollider(x, y, z, r) {
  for (const c of nearby(x, z)) {
    if (y > c.base + c.h + r) continue;
    if (c.t === 'c') { if (Math.hypot(x - c.x, z - c.z) < c.r + r) return true; }
    else {
      const cs = Math.cos(c.rot), sn = Math.sin(c.rot), dx = x - c.x, dz = z - c.z;
      if (Math.abs(cs * dx - sn * dz) < c.hw + r && Math.abs(sn * dx + cs * dz) < c.hd + r) return true;
    }
  }
  return false;
}

// ============================================================
//  렌더러 / 씬
// ============================================================
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = isTouch ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
const scene = new THREE.Scene();
const FOG = 0x101b3a;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 45, 125);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 400);
scene.add(new THREE.HemisphereLight(0x8aa4e8, 0x1c2240, 0.55));
const moon = new THREE.DirectionalLight(0xc4d4ff, 0.8);
moon.castShadow = true;
moon.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(moon.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 1, far: 140 });
moon.shadow.bias = -0.0008;
scene.add(moon, moon.target);

const matCache = new Map();
function mat(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) {
    matCache.set(key, o.basic ? new THREE.MeshBasicMaterial({ color })
      : new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? 0.85, metalness: o.metal ?? 0, flatShading: o.flat ?? true,
        emissive: o.em ?? 0x000000, emissiveIntensity: o.emI ?? 1 }));
  }
  return matCache.get(key);
}
// 캐릭터용 툰 셰이딩 (귀여운 만화 느낌)
const toonGrad = new THREE.DataTexture(new Uint8Array([110, 110, 110, 255, 190, 190, 190, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
toonGrad.minFilter = toonGrad.magFilter = THREE.NearestFilter; toonGrad.needsUpdate = true;
const toonCache = new Map();
function toon(color, own = false) {
