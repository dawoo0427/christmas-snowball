<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>크리스마스 눈싸움 3D</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0d1630; color:#f4f7ff;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .panel { position:fixed; pointer-events:none; text-shadow:0 2px 4px #0009; }
  #stats { left:16px; top:14px; }
  #hearts { font-size:26px; letter-spacing:2px; color:#ff4d6d; }
  #hearts .off { opacity:.25; color:#fff; }
  #ammo { margin-top:4px; display:flex; gap:5px; align-items:center; }
  #ammo i { width:13px; height:13px; border-radius:50%; background:#fff; box-shadow:0 0 4px #9cf; display:inline-block; }
  #ammo i.off { background:#ffffff30; box-shadow:none; }
  #ammo span { font-size:13px; margin-left:6px; color:#cfe0ff; }
  #buffs { margin-top:6px; font-size:14px; font-weight:bold; display:flex; flex-direction:column; gap:2px; }
  #objective { left:50%; top:12px; transform:translateX(-50%); text-align:center; background:#0b1430b0; padding:8px 18px; border-radius:12px; border:1px solid #ffffff25; }
  #objective b { color:#ffd34d; }
  #objective small { display:block; color:#cfe0ff; font-size:12px; margin-top:2px; }
  #scorebox { right:16px; top:204px; text-align:right; }
  #score { font-size:26px; font-weight:bold; }
  #combo { color:#7dffb0; font-weight:bold; font-size:18px; min-height:22px; }
  #mini { position:fixed; right:14px; top:12px; width:180px; height:180px; border-radius:12px; border:2px solid #ffffff50; background:#0b1430; pointer-events:none; }
  #toast { left:50%; top:28%; transform:translateX(-50%); text-align:center; font-size:38px; font-weight:900; color:#ffd34d; opacity:0; transition:opacity .3s; white-space:nowrap; }
  #toast small { display:block; font-size:18px; color:#fff; font-weight:bold; margin-top:4px; }
  #help { left:16px; bottom:12px; font-size:12px; color:#cfe0ffcc; line-height:1.6; }
  #hurt { position:fixed; inset:0; pointer-events:none; box-shadow: inset 0 0 160px #ff2040; opacity:0; transition:opacity .15s; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .hp { position:absolute; width:46px; height:6px; margin-left:-23px; background:#0009; border-radius:3px; overflow:hidden; }
  .hp i { display:block; height:100%; background:linear-gradient(90deg,#ff5252,#ff8a65); }
  .hp.boss { width:110px; margin-left:-55px; height:9px; }
  .pop { position:absolute; transform:translate(-50%,-50%); font-weight:900; font-size:20px; text-shadow:0 2px 3px #000a; white-space:nowrap; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#050a1ccc; z-index:5; text-align:center; padding:16px; overflow:auto; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:clamp(28px,6vw,54px); margin:0 0 6px; }
  #overlay h2 { color:#ffd34d; font-size:clamp(15px,2.4vw,21px); margin:0 0 20px; line-height:1.5; }
  #overlay .keys { display:grid; grid-template-columns:auto auto; gap:6px 18px; text-align:left; margin:0 auto 22px; width:max-content; max-width:100%; font-size:15px; color:#e6eeff; }
  #overlay .keys b { color:#7dd3ff; }
  #overlay button { font-size:20px; font-weight:bold; padding:12px 34px; border-radius:30px; border:none; background:#e53935; color:#fff; cursor:pointer; box-shadow:0 4px 0 #8e1c1a; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #8e1c1a; }
  #overlay .stat { font-size:20px; margin:6px 0; }
  #touch { display:none; }
  @media (pointer:coarse) {
    #help { display:none; }
    #touch { display:block; }
    #stick { position:fixed; left:24px; bottom:24px; width:130px; height:130px; border-radius:50%; background:#ffffff18; border:2px solid #ffffff40; }
    #knob { position:absolute; left:40px; top:40px; width:50px; height:50px; border-radius:50%; background:#ffffff60; }
    #tbtns { position:fixed; right:18px; bottom:24px; display:flex; gap:10px; }
    #tbtns button { width:60px; height:60px; border-radius:50%; border:2px solid #ffffff70; background:#ffffff22; color:#fff; font-weight:bold; font-size:15px; }
    #mini { width:120px; height:120px; }
    #scorebox { top:140px; }
    #overlay .keys { font-size:13px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="labels"></div>
<div id="hurt"></div>
<div class="panel" id="stats"><div id="hearts"></div><div id="ammo"></div><div id="buffs"></div></div>
<div class="panel" id="objective"></div>
<canvas id="mini" width="180" height="180"></canvas>
<div class="panel" id="scorebox"><div id="score">0</div><div id="combo"></div></div>
<div class="panel" id="toast"></div>
<div class="panel" id="help">
  WASD 이동 · Shift 대시 · Space 점프 · 마우스 조준<br>
  좌클릭 던지기(꾹 누르면 강한 눈덩이) · R 재장전<br>
  Q/E 또는 우클릭 드래그 카메라 회전 · 휠 줌 · M 음악 · P 일시정지
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns"><button data-b="reload">R</button><button data-b="dash">대시</button><button data-b="jump">점프</button></div>
</div>
<div id="overlay"></div>

<script src="lib/three.min.js"></script>
<script>
(() => {
'use strict';
// ============================================================
//  기본 유틸
// ============================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = t => t * t * (3 - 2 * t);
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const angLerp = (a, b, t) => a + angDiff(a, b) * t;
let seed = 20261225;
function srand() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const sr = (a, b) => a + srand() * (b - a);
const $ = id => document.getElementById(id);

// ============================================================
//  월드 정의
// ============================================================
const G = 26;               // 중력
const LIMIT = 112;          // 플레이 가능 범위
const VILLAGE = { x: 0, z: 0, safe: 28 };
const CAMPS = [
  { x: 55,  z: -40, name: '얼음 언덕 캠프',    snow: 2, peng: 0 },
  { x: -62, z: -42, name: '소나무 숲 캠프',    snow: 3, peng: 1 },
  { x: -66, z: 52,  name: '꽁꽁 호수 캠프',    snow: 3, peng: 2 },
  { x: 62,  z: 58,  name: '눈보라 골짜기 캠프', snow: 4, peng: 3 },
  { x: 0,   z: -92, name: '눈사람 왕의 요새',  snow: 3, peng: 2, boss: true },
];
const LAKE = { x: -24, z: 70, r: 15 };

function baseH(x, z) {
  return 2.2 * Math.sin(x * 0.045) * Math.cos(z * 0.04) + 0.9 * Math.sin(x * 0.12 + z * 0.08)
       + 1.1 * Math.cos(z * 0.1 - x * 0.035) + 0.45 * Math.sin(x * 0.3) * Math.sin(z * 0.27);
}
const FLATS = [
  { x: 0, z: 0, inner: 32, outer: 44 },
  ...CAMPS.map(c => ({ x: c.x, z: c.z, inner: c.boss ? 19 : 14, outer: c.boss ? 30 : 23 })),
  { x: LAKE.x, z: LAKE.z, inner: LAKE.r + 1, outer: LAKE.r + 10, lower: -1.4 },
];
FLATS.forEach(f => f.h = baseH(f.x, f.z) + (f.lower || 0));
function heightAt(x, z) {
  let h = baseH(x, z);
  for (const f of FLATS) {
    const d = Math.hypot(x - f.x, z - f.z);
    if (d < f.outer) { const t = smooth(clamp((d - f.inner) / (f.outer - f.inner), 0, 1)); h = f.h + (h - f.h) * t; }
  }
  const e = Math.max(Math.abs(x), Math.abs(z));
  if (e > 108) { const k = e - 108; h += k * k * 0.06 + k * 0.35; }
  return h;
}
const PATHS = CAMPS.map(c => [0, 0, c.x, c.z]);
function pathDist(x, z) {
  let best = 1e9;
  for (const [ax, az, bx, bz] of PATHS) {
    const dx = bx - ax, dz = bz - az, t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
    best = Math.min(best, Math.hypot(x - ax - dx * t, z - az - dz * t));
  }
  return best;
}
const onIce = (x, z) => Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r;

// ============================================================
//  충돌체 (공간 격자). 박스 rot = 메쉬 rotation.y 와 동일
// ============================================================
const CELL = 10, grid = new Map();
function addCollider(c) {
  c.base = heightAt(c.x, c.z) - 0.5;
  const r = c.t === 'c' ? c.r : Math.hypot(c.hw, c.hd);
  for (let ix = Math.floor((c.x - r - 2) / CELL); ix <= Math.floor((c.x + r + 2) / CELL); ix++)
    for (let iz = Math.floor((c.z - r - 2) / CELL); iz <= Math.floor((c.z + r + 2) / CELL); iz++) {
      const k = ix + ',' + iz; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(c);
    }
}
const nearby = (x, z) => grid.get(Math.floor(x / CELL) + ',' + Math.floor(z / CELL)) || [];
function pushOut(o, r) {
  for (const c of nearby(o.x, o.z)) {
    if (c.t === 'c') {
      const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), m = r + c.r;
      if (d < m && d > 1e-5) { o.x = c.x + dx / d * m; o.z = c.z + dz / d * m; }
    } else {
      const cs = Math.cos(c.rot), sn = Math.sin(c.rot), dx = o.x - c.x, dz = o.z - c.z;
      let lx = cs * dx - sn * dz, lz = sn * dx + cs * dz;
      const qx = clamp(lx, -c.hw, c.hw), qz = clamp(lz, -c.hd, c.hd);
      const ex = lx - qx, ez = lz - qz, d = Math.hypot(ex, ez);
      if (d < r) {
        if (d > 1e-5) { lx = qx + ex / d * r; lz = qz + ez / d * r; }
        else { const px = c.hw - Math.abs(lx), pz = c.hd - Math.abs(lz); if (px < pz) lx = Math.sign(lx || 1) * (c.hw + r); else lz = Math.sign(lz || 1) * (c.hd + r); }
        o.x = c.x + cs * lx + sn * lz; o.z = c.z - sn * lx + cs * lz;
      }
    }
  }
}
function ballHitsCollider(b) {
  for (const c of nearby(b.p.x, b.p.z)) {
    if (b.p.y > c.base + c.h + b.r) continue;
    if (c.t === 'c') { if (Math.hypot(b.p.x - c.x, b.p.z - c.z) < c.r + b.r) return true; }
    else {
      const cs = Math.cos(c.rot), sn = Math.sin(c.rot), dx = b.p.x - c.x, dz = b.p.z - c.z;
      if (Math.abs(cs * dx - sn * dz) < c.hw + b.r && Math.abs(sn * dx + cs * dz) < c.hd + b.r) return true;
    }
  }
  return false;
}

// ============================================================
//  렌더러 / 씬
// ============================================================
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
const scene = new THREE.Scene();
const FOG = 0x101b3a;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 45, 125);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 400);

scene.add(new THREE.HemisphereLight(0x8aa4e8, 0x1c2240, 0.5));
const moon = new THREE.DirectionalLight(0xc4d4ff, 0.75);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 140 });
moon.shadow.bias = -0.0008;
scene.add(moon, moon.target);

const matCache = new Map();
function mat(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) {
    matCache.set(key, o.basic ? new THREE.MeshBasicMaterial({ color })
      : new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? 0.85, metalness: o.metal ?? 0, flatShading: o.flat ?? true,
        emissive: o.em ?? 0x000000, emissiveIntensity: o.emI ?? 1 }));
  }
  return matCache.get(key);
}
function mk(geo, material, x = 0, y = 0, z = 0, parent, shadow = true) {
  const m = new THREE.Mesh(geo, material); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const Sph = (r, w = 12, h = 9) => new THREE.SphereGeometry(r, w, h);
const Cyl = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
const Cone = (r, h, s = 8) => new THREE.ConeGeometry(r, h, s);
const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);

function radialTex(inner, mid) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, inner); g.addColorStop(0.35, mid); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const glowTex = radialTex('rgba(255,255,255,1)', 'rgba(255,255,255,0.3)');
const dotTex = radialTex('rgba(255,255,255,1)', 'rgba(255,255,255,0.9)');
const glows = [];
function glow(color, size, x, y, z, parent, twinkle = 0) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55 }));
  s.scale.set(size, size, 1); s.position.set(x, y, z); (parent || scene).add(s);
  if (twinkle) glows.push({ s, base: size, ph: Math.random() * TAU, sp: twinkle });
  return s;
}

// ============================================================
//  지형
// ============================================================
function buildTerrain() {
  const geo = new THREE.PlaneGeometry(300, 300, 150, 150); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, n = pos.count;
  for (let i = 0; i < n; i++) pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const nor = geo.attributes.normal, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const x = pos.getX(i), z = pos.getZ(i), ny = nor.getY(i);
    let c = [0.8, 0.86, 0.98];
    const v = Math.sin(x * 1.7 + z * 2.3) * Math.cos(x * 2.9 - z * 1.1) * 0.025; c = c.map(k => k + v);
    const pd = pathDist(x, z);
    if (pd < 3.5) { const t = 1 - pd / 3.5; c = c.map((k, j) => lerp(k, [0.6, 0.64, 0.78][j], t * 0.85)); }
    if (ny < 0.8) { const t = clamp((0.8 - ny) * 3, 0, 1); c = c.map((k, j) => lerp(k, [0.55, 0.6, 0.72][j], t)); }
    col.set(c, i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
  m.receiveShadow = true; scene.add(m);
  // 얼음 호수
  const ice = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r + 0.8, 40), new THREE.MeshStandardMaterial({ color: 0x8fc8ee, roughness: 0.12, metalness: 0.35 }));
  ice.rotation.x = -Math.PI / 2; ice.position.set(LAKE.x, FLATS[FLATS.length - 1].h + 0.06, LAKE.z); ice.receiveShadow = true; scene.add(ice);
  for (let i = 0; i < 10; i++) {
    const crack = mk(Box(sr(3, 7), 0.02, 0.08), mat(0xdff3ff, { basic: true }), LAKE.x + sr(-9, 9), ice.position.y + 0.02, LAKE.z + sr(-9, 9), scene, false);
    crack.rotation.y = sr(0, TAU);
  }
}

// ============================================================
//  나무 / 바위 (인스턴싱)
// ============================================================
const trees = [];
function buildForest() {
  const spots = [];
  const ok = (x, z, minD) => {
    for (const f of FLATS) if (Math.hypot(x - f.x, z - f.z) < f.outer - 3) return false;
    if (pathDist(x, z) < 5) return false;
    for (const s of spots) if (Math.abs(s.x - x) < minD && Math.abs(s.z - z) < minD && Math.hypot(s.x - x, s.z - z) < minD) return false;
    return true;
  };
  for (let i = 0; i < 2600 && spots.length < 460; i++) {
    const x = sr(-140, 140), z = sr(-140, 140);
    if (ok(x, z, 3.6)) spots.push({ x, z, s: sr(0.75, 1.55), r: sr(0, TAU), heavy: srand() < 0.3 });
  }
  const tier = (r, h, base) => { const g = Cone(r, h, 7); g.translate(0, base + h / 2, 0); return g; };
  const trunkG = Cyl(0.3, 0.38, 1.4, 6); trunkG.translate(0, 0.7, 0);
  const parts = [
    { g: trunkG, m: mat(0x5a3a22) },
    { g: tier(2.3, 2.4, 1.1), m: mat(0xffffff), tint: true },
    { g: tier(1.8, 2.1, 2.3), m: mat(0xffffff), tint: true },
    { g: tier(1.25, 1.8, 3.4), m: mat(0xffffff), tint: true },
    { g: tier(0.58, 0.83, 4.38), m: mat(0xf4f8ff) },
  ];
  const meshes = parts.map(p => { const im = new THREE.InstancedMesh(p.g, p.m, spots.length); im.castShadow = true; im.receiveShadow = true; scene.add(im); return im; });
  const M = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color(), up = new THREE.Vector3(0, 1, 0);
  spots.forEach((s, i) => {
    const y = heightAt(s.x, s.z) - 0.25;
    q.setFromAxisAngle(up, s.r);
    M.compose(new THREE.Vector3(s.x, y, s.z), q, new THREE.Vector3(s.s, s.s, s.s));
    meshes.forEach((im, k) => {
      im.setMatrixAt(i, M);
      if (parts[k].tint) {
        if (s.heavy) col.setRGB(0.5 + k * 0.06, 0.68, 0.7); else col.setRGB(0.08 + srand() * 0.05, 0.3 + srand() * 0.08 + k * 0.02, 0.18 + srand() * 0.05);
        im.setColorAt(i, col);
      }
    });
    addCollider({ t: 'c', x: s.x, z: s.z, r: 0.55 * s.s + 0.3, h: 5.2 * s.s });
    trees.push(s);
  });
  // 바위
  const rocks = []; for (let i = 0; i < 400 && rocks.length < 70; i++) { const x = sr(-120, 120), z = sr(-120, 120); if (ok(x, z, 5)) rocks.push({ x, z, s: sr(0.6, 1.6) }); }
  const rim = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), mat(0x8890a8), rocks.length);
  const cap = new THREE.InstancedMesh(new THREE.SphereGeometry(0.85, 7, 4, 0, TAU, 0, Math.PI / 2.4), mat(0xf4f8ff), rocks.length);
  rim.castShadow = cap.castShadow = true; rim.receiveShadow = cap.receiveShadow = true;
  rocks.forEach((r, i) => {
    const y = heightAt(r.x, r.z);
    q.setFromEuler(new THREE.Euler(sr(0, 1), sr(0, TAU), 0));
    M.compose(new THREE.Vector3(r.x, y + 0.2 * r.s, r.z), q, new THREE.Vector3(r.s * 1.2, r.s * 0.8, r.s)); rim.setMatrixAt(i, M);
    M.compose(new THREE.Vector3(r.x, y + 0.55 * r.s, r.z), new THREE.Quaternion(), new THREE.Vector3(r.s * 1.15, r.s * 0.8, r.s)); cap.setMatrixAt(i, M);
    addCollider({ t: 'c', x: r.x, z: r.z, r: r.s * 1.05, h: r.s * 1.3 });
  });
  scene.add(rim, cap);
}

// ============================================================
//  마을
// ============================================================
const twinkleBulbs = [];
let starMesh;
function buildHouse(x, z, rot, wallCol) {
  const g = new THREE.Group(); g.position.set(x, heightAt(x, z) - 0.3, z); g.rotation.y = rot; scene.add(g);
  mk(Box(7, 4.3, 6), mat(wallCol), 0, 2.15, 0, g);
  const roof = mk(Cyl(4.3, 4.3, 8, 3), mat(0xf2f6ff), 0, 5.6, 0, g); roof.rotation.z = Math.PI / 2; roof.scale.set(0.62, 1, 1);
  const eave = mk(Cyl(4.05, 4.05, 7.8, 3), mat(0x7a2e22), 0, 5.4, 0, g); eave.rotation.z = Math.PI / 2; eave.scale.set(0.62, 1, 1);
  mk(Box(1.5, 2.5, 0.2), mat(0x4a2a16), 0, 1.25, 3.02, g);

const camps = [];
function buildCamp(def, idx) {

  const wallMat = mat(0xdfe8fb), topMat = mat(0xf6f9ff);

  mk(Box(1.2, 1.1, 0.1), mat(0x1a2238), 0, 0.5, 2.9, ig, false);

  for (let i = 0; i < 18; i++) { const f = srand(), a = srand() * TAU, rr = 2.1 * (1 - f * 0.8) + 0.1; mk(Sph(0.13, 6, 4), mat([0xff4d4d, 0xffd34d, 0x4dc3ff, 0xff7dd8][i % 4], { basic: true }), Math.cos(a) * rr, 1 + f * 3.8, Math.sin(a) * rr, lib, false); }
  mk(Sph(0.32, 8, 6), mat(0xffd34d, { em: 0xffc020, emI: 2 }), 0, 5.4, 0, lib, false);

const NOTE = { C: 523.25, D: 587.33, E: 659.25, F: 698.46, G: 783.99 };

  .match(/[A-GR][\d.]+/g).map(s => [s[0], parseFloat(s.slice(1))]);
let songIdx = 0, songT = 0;
setInterval(() => {
  if (!ac || !musicOn || state !== 'play') return;

    if (Math.hypot(x, z) < 16) continue;
    if (camps.some(c => Math.hypot(x - c.def.x, z - c.def.z) < c.R + 3)) continue;

    if (!q || q.life <= 0) { pPos[i * 3 + 1] = -999; continue; }
    q.life -= dt; q.vy -= 18 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
    pPos[i * 3] = q.x; pPos[i * 3 + 1] = q.y; pPos[i * 3 + 2] = q.z; pCol[i * 3] = q.r; pCol[i * 3 + 1] = q.g; pCol[i * 3 + 2] = q.b;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
  for (let i = 0; i < SNOW; i++) {
    const v = sVel[i]; v.w += dt;
    let x = sPos[i * 3] + Math.sin(v.w) * 0.8 * dt, y = sPos[i * 3 + 1] - v.v * dt, z = sPos[i * 3 + 2];
    if (x - p.x > 50) x -= 100; if (x - p.x < -50) x += 100; if (z - p.z > 50) z -= 100; if (z - p.z < -50) z += 100;
    if (y < p.y - 5) y += 38;
    sPos[i * 3] = x; sPos[i * 3 + 1] = y; sPos[i * 3 + 2] = z;
  }
  sGeo.attributes.position.needsUpdate = true;

  for (const e of enemies) {
    if (state === 'play' && e.hp < e.max && e.model.group.visible) {
      const s = toScreen(new THREE.Vector3(e.x, e.y + e.T.h + 0.8, e.z));
      if (s.ok) {
        if (!e.bar) { e.bar = document.createElement('div'); e.bar.className = 'hp' + (e.type === 'boss' ? ' boss' : ''); e.bar.innerHTML = '<i></i>'; $('labels').appendChild(e.bar); }
        e.bar.style.left = s.x + 'px'; e.bar.style.top = s.y + 'px'; e.bar.firstChild.style.width = (e.hp / e.max * 100) + '%'; e.bar.style.display = '';
        continue;
      }
    }
    if (e.bar) e.bar.style.display = 'none';
  }
  for (const u of popups) {
    u.t -= dt; u.p.y += dt * 2;
    const s = toScreen(u.p); u.el.style.left = s.x + 'px'; u.el.style.top = s.y + 'px'; u.el.style.opacity = Math.min(1, u.t * 2);
    if (u.t <= 0) u.el.remove();
  }
  popups = popups.filter(u => u.t > 0);
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').style.opacity = 0; }

  if (state !== 'title') { updateHUD(); drawMinimap(); }
  renderer.render(scene, camera);
}

// ============================================================
//  초기화
// ============================================================
buildTerrain();
buildVillage();
CAMPS.forEach(buildCamp);
buildForest();
buildMinimapBg();
elf = makeElf(); scene.add(elf.group);
player = newPlayer();
populateCamps();
for (let i = 0; i < 16; i++) spawnGift();
resize();
for (const id of ['stats', 'objective', 'mini', 'scorebox', 'help']) $(id).style.visibility = 'hidden';
overlay('title');
requestAnimationFrame(frame);
window.__game = {
  get state() { return state; }, get score() { return score; }, get player() { return player; }, get enemies() { return enemies; }, get camps() { return camps; },
  startGame, teleport(x, z) { player.x = x; player.z = z; }, screen(x, y, z) { return toScreen(new THREE.Vector3(x, y, z)); },
  sim(sec, fn) { for (let t = 0; t < sec && state === 'play'; t += 1 / 30) { if (fn) fn(); update(1 / 30); } },
  aimAt(x, z) { mouse.has = false; player.face = Math.atan2(x - player.x, z - player.z); }, throwNow() { player.charge = 0; player.cd = 0; throwPlayer(); }, info: () => renderer.info.render,
};
})();
</script>
