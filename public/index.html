<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>크리스마스 눈싸움 3D</title>
<meta name="description" content="누구나 접속해서 함께 노는 크리스마스 3D 오픈월드 눈싸움">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* 레이아웃: 화면 전체 3D 캔버스 위에 HUD. 밤 겨울 마을의 단일(다크) 테마 */
  :root {
    --night: #0d1630; --panel: #0b1430c8; --ink: #f4f7ff; --muted: #cfe0ff;
    --gold: #ffd34d; --red: #e53935; --red-dark: #8e1c1a; --mint: #7dffb0; --sky: #7dd3ff; --heart: #ff4d6d;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --body: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; touch-action:none; }
  #overlay, #overlay *, #settings, #settings * { touch-action:pan-y; }
  input, textarea { touch-action:manipulation; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--night); color:var(--ink); font-family:var(--body);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .panel { position:fixed; pointer-events:none; text-shadow:0 2px 4px #0009; }
  #stats { left:calc(14px + env(safe-area-inset-left,0px)); top:calc(12px + env(safe-area-inset-top,0px)); }
  #hpbar { position:relative; width:220px; height:20px; border-radius:11px; background:#0b1430c0; border:2px solid #ffffff60; overflow:hidden; }
  #hpbar i { position:absolute; inset:0 auto 0 0; width:100%; background:linear-gradient(90deg,#ff4d6d,#ff8a65); transition:width .15s; }
  #hpbar i.mid { background:linear-gradient(90deg,#ffb300,#ffd34d); }
  #hpbar i.high { background:linear-gradient(90deg,#2ecc71,#7dffb0); }
  #hpbar span { position:relative; display:block; text-align:center; font-family:var(--display); font-size:14px; line-height:16px; color:#fff; text-shadow:0 1px 2px #000; }
  #actBtns { position:fixed; right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; align-items:flex-end; z-index:3; }
  #actBtns .act { display:none; font-family:var(--display); font-size:18px; padding:10px 18px; border-radius:24px; border:2px solid #ffffff80; background:#6d4c41e6; color:#fff; cursor:pointer; box-shadow:0 3px 0 #3e2723; white-space:nowrap; }
  #actBtns .act:active { transform:translateY(2px); box-shadow:0 1px 0 #3e2723; }
  #actBtns .act.on { background:#3ddc84e6; box-shadow:0 3px 0 #1b7a45; }
  #sitBtn { background:#8d6e63e6 !important; }
  #igBtn { background:#4f86c6e6 !important; box-shadow:0 3px 0 #1f4e85 !important; }
  body.playing.canigloo #igBtn, body.playing.canup #upBtn, body.playing.onice #fishBtn { display:block; }
  #upBtn { background:#7e57c2e6 !important; box-shadow:0 3px 0 #4527a0 !important; }
  #fishBtn { background:#00838fe6 !important; box-shadow:0 3px 0 #005662 !important; }
  #fishBtn.on { background:#ff7043e6 !important; }
  #foodBtn { background:#d9933fe6 !important; box-shadow:0 3px 0 #8a5520 !important; }
  #skinBtn { background:#5d4037e6 !important; box-shadow:0 3px 0 #3e2723 !important; }
  body.playing.neartruck #foodBtn, body.playing.hasskin #skinBtn { display:block; }
  #treeBtn { background:#2e7d32e6 !important; box-shadow:0 3px 0 #1b4d1f !important; }
  body.playing.neartree #treeBtn { display:block; }
  #sledBtn { background:#c62828e6 !important; box-shadow:0 3px 0 #7f0000 !important; }
  #sledBtn.on { background:#ffb300e6 !important; box-shadow:0 3px 0 #a86b00 !important; }
  body.playing.cansled #sledBtn { display:block; }
  #yamBtn { background:#8e4e2fe6 !important; box-shadow:0 3px 0 #4e2414 !important; }
  #yamBtn.on { background:#ffb74de6 !important; }
  body.playing.fireseat #yamBtn { display:block; }
  #allyAsk { position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:6; display:none; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
    background:#0b1430f0; border:2px solid #7dffb0; border-radius:16px; padding:10px 14px; font-family:var(--display); font-size:16px; max-width:calc(100vw - 32px); box-shadow:0 6px 20px #0008; }
  #allyAsk.open { display:flex; }
  #allyAsk button { font-family:var(--display); font-size:15px; padding:6px 14px; border-radius:12px; border:none; color:#fff; cursor:pointer; background:#2e7d32; }
  #allyAsk button[data-ok="0"] { background:#6d6d7a; }
  #plistSet button.ally { border-color:#7dffb0; }
  #plistSet button.ally.on { background:#2e7d32; border-color:#7dffb0; }
  .tag.igtag { font-size:12px; color:#cfe8ff; background:#0b143099; }
  #sitBtn.on { background:#ffb74de6 !important; box-shadow:0 3px 0 #a86b12 !important; }
  body.playing.safe #teaBtn, body.playing.nearfire #sitBtn { display:block; }
  body.touch #actBtns { bottom:calc(88px + env(safe-area-inset-bottom,0px)); flex-direction:column-reverse; gap:6px; }
  body.touch #actBtns .act { font-size:13px; padding:5px 10px; border-width:1.5px; border-radius:16px; box-shadow:0 2px 0 #3e2723; }
  body.touch #actBtns .act small { display:none; }
  #gear { position:fixed; right:calc(202px + env(safe-area-inset-right,0px)); top:calc(12px + env(safe-area-inset-top,0px)); width:42px; height:42px; border-radius:50%; border:2px solid #ffffff60;
    background:#0b1430c8; color:#fff; font-size:20px; cursor:pointer; display:none; z-index:3; }
  body.playing #gear { display:block; }
  body.touch #gear { right:calc(140px + env(safe-area-inset-right,0px)); }
  #settings { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(360px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto;
    background:#0b1430f2; border:2px solid #ffffff40; border-radius:18px; padding:18px 20px; z-index:6; display:none; user-select:text; }
  #settings.open { display:block; }
  #settings h3 { font-family:var(--display); font-weight:400; font-size:24px; margin:0 0 12px; }
  #settings label.opt { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #ffffff18; font-size:15px; cursor:pointer; }
  #settings label.opt small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  #settings input[type=checkbox] { appearance:none; -webkit-appearance:none; width:50px; height:28px; border-radius:14px; background:#ffffff30; position:relative; flex:none; cursor:pointer; transition:background .15s; }
  #settings input[type=checkbox]::after { content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s; }
  #settings input[type=checkbox]:checked { background:#2ecc71; }
  #settings input[type=checkbox]:checked::after { left:25px; }
  #settings input[type=checkbox]:disabled { opacity:.4; }
  #settings input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  #settings .vstat { font-size:13px; color:var(--muted); margin:10px 0 0; line-height:1.5; }
  #settings .safe { font-size:12px; color:#ffd9a0; background:#ffb3001a; border-radius:10px; padding:8px 10px; margin:10px 0 0; line-height:1.55; }
  #settings h4 { font-family:var(--display); font-weight:400; font-size:18px; margin:16px 0 6px; }
  #plistSet { display:flex; flex-direction:column; gap:6px; max-height:200px; overflow:auto; }
  #plistSet .prow { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:10px; background:#ffffff0d; }
  #plistSet .prow b { flex:1; min-width:0; font-family:var(--display); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #plistSet .prow small { color:var(--muted); font-size:11px; }
  #plistSet button { flex:none; font-size:13px; padding:5px 10px; border-radius:10px; border:1px solid #ffffff40; background:#ffffff12; color:#fff; cursor:pointer; white-space:nowrap; }
  #plistSet button.on { background:#e53935; border-color:#e53935; }
  #plistSet .empty { color:var(--muted); font-size:13px; }
  #settings .close { margin-top:14px; width:100%; font-family:var(--display); font-size:18px; padding:10px; border:none; border-radius:14px; background:var(--red); color:#fff; cursor:pointer; }
  #ammo { margin-top:6px; display:flex; gap:5px; align-items:center; flex-wrap:wrap; max-width:220px; }
  #ammo i { width:13px; height:13px; border-radius:50%; background:#fff; box-shadow:0 0 4px #9cf; display:inline-block; }
  #ammo i.off { background:#ffffff30; box-shadow:none; }
  #ammo span { font-size:13px; margin-left:4px; color:var(--muted); }
  #buffs { margin-top:6px; font-size:14px; font-family:var(--display); display:flex; flex-direction:column; gap:2px; }
  #objective { left:50%; top:calc(10px + env(safe-area-inset-top,0px)); transform:translateX(-50%); text-align:center; background:var(--panel);
    padding:7px 16px; border-radius:14px; border:1px solid #ffffff25; font-family:var(--display); font-size:17px; max-width:min(460px, 56vw); }
  #objective b { color:var(--gold); }
  #objective small { display:block; color:var(--muted); font-family:var(--body); font-size:12px; margin-top:2px; }
  #scorebox { right:calc(14px + env(safe-area-inset-right,0px)); top:calc(200px + env(safe-area-inset-top,0px)); text-align:right; }
  #score { font-size:26px; font-family:var(--display); }
  #combo { color:var(--mint); font-family:var(--display); font-size:18px; min-height:22px; }
  #board { font-size:13px; color:var(--muted); line-height:1.55; margin-top:4px; background:#0b1430b8; padding:5px 10px; border-radius:10px; }
  #board:empty { display:none; }
  #board b { font-family:var(--display); font-weight:400; color:var(--ink); }
  #board .me { color:var(--gold); }
  #mini { position:fixed; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(10px + env(safe-area-inset-top,0px)); width:180px; height:180px;
    border-radius:14px; border:2px solid #ffffff50; background:#0b1430; pointer-events:none; }
  #toast { left:50%; top:24%; transform:translateX(-50%); text-align:center; font-family:var(--display); font-size:38px; color:var(--gold); opacity:0; transition:opacity .3s; white-space:nowrap; }
  #toast small { display:block; font-size:18px; color:#fff; margin-top:4px; }
  #feed { left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(76px + env(safe-area-inset-bottom,0px)); width:min(380px, 60vw); font-size:13px; display:flex; flex-direction:column; gap:3px; }
  #feed div { background:#0b1430a0; padding:3px 9px; border-radius:8px; width:max-content; max-width:100%; overflow-wrap:anywhere; transition:opacity .6s; }
  #feed b { font-weight:700; }
  #feed .sys { color:var(--gold); }
  #help { left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); font-size:12px; color:#cfe0ffcc; line-height:1.6; }
  #chatbox { position:fixed; left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(46px + env(safe-area-inset-bottom,0px)); display:none; gap:6px; z-index:4; }
  #chatbox.open { display:flex; }
  #chatbox input { flex:1; min-width:0; width:min(320px, 62vw); font-size:15px; padding:8px 12px; border-radius:12px; border:2px solid #ffffff50; background:#0b1430e8; color:#fff; user-select:text; -webkit-user-select:text; }
  #chatbox button { flex:none; white-space:nowrap; font-family:var(--display); font-size:15px; border:none; border-radius:12px; padding:0 16px; background:#2f6fd6; color:#fff; }
  #respawn { left:50%; top:45%; transform:translate(-50%,-50%); font-family:var(--display); font-size:30px; text-align:center; display:none; }
  #net { left:50%; bottom:calc(12px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); font-size:13px; color:#ffb3b3; display:none; }
  #hurt { position:fixed; inset:0; pointer-events:none; box-shadow: inset 0 0 160px #ff2040; opacity:0; transition:opacity .15s; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .hp { position:absolute; width:46px; height:6px; margin-left:-23px; background:#0009; border-radius:3px; overflow:hidden; }
  .hp i { display:block; height:100%; background:linear-gradient(90deg,#ff5252,#ff8a65); }
  .hp.boss { width:110px; margin-left:-55px; height:9px; }
  .hp.ph { width:44px; margin-left:-22px; height:6px; border:1px solid #ffffffa0; border-radius:4px; transition:opacity .3s; }
  .hp.ph i { background:linear-gradient(90deg,#2ecc71,#7dffb0); transition:width .2s; }
  .hp.ph.mid i { background:linear-gradient(90deg,#ffb300,#ffd34d); }
  .hp.ph.low i { background:linear-gradient(90deg,#ff4d6d,#ff8a65); }
  .pop { position:absolute; transform:translate(-50%,-50%); font-family:var(--display); font-size:21px; text-shadow:0 2px 3px #000a; white-space:nowrap; }
  .tag { position:absolute; transform:translate(-50%,-100%); font-family:var(--display); font-size:14px; padding:1px 8px; border-radius:9px; background:#0008; white-space:nowrap; text-align:center; }
  .tag .bubble { display:block; font-family:var(--body); font-size:13px; color:#1a1420; background:#fff; border-radius:10px; padding:3px 8px; margin-bottom:3px; max-width:220px; white-space:normal; overflow-wrap:anywhere; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#050a1cd9; z-index:5; text-align:center;
    padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
    overflow:auto; user-select:text; -webkit-user-select:text; }
  #overlay.hidden { display:none; }
  #overlay > div { max-width:640px; width:100%; margin:auto; }
  #overlay h1 { font-family:var(--display); font-weight:400; font-size:clamp(30px,7vw,58px); margin:0 0 6px; letter-spacing:1px; }
  #overlay h2 { color:var(--gold); font-family:var(--body); font-size:clamp(14px,2.4vw,19px); font-weight:700; margin:0 0 16px; line-height:1.55; text-wrap:balance; }
  #overlay .keys { display:grid; grid-template-columns:auto 1fr; gap:5px 16px; text-align:left; margin:0 auto 14px; width:max-content; max-width:100%; font-size:14px; color:#e6eeff; }
  #overlay .keys b { color:var(--sky); white-space:nowrap; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
  #overlay button { font-family:var(--display); font-size:22px; padding:12px 34px; border-radius:30px; border:none; background:var(--red); color:#fff; cursor:pointer; box-shadow:0 4px 0 var(--red-dark); }
  #overlay button:disabled { opacity:.45; cursor:default; }
  #overlay button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--red-dark); }
  #overlay button:focus-visible, #overlay input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  #overlay input { font-family:var(--display); font-size:20px; padding:9px 14px; border-radius:14px; border:2px solid #ffffff40; background:#0b1430; color:#fff; text-align:center; width:220px; max-width:100%; }
  #overlay .row { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; margin:8px 0; }
  #overlay .note { color:var(--muted); font-size:13px; line-height:1.6; }
  .servers { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #overlay .servers button { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:118px; padding:8px 14px 8px 24px; border-radius:16px; background:#ffffff14; border:2px solid #ffffff30; box-shadow:none; font-family:var(--body); position:relative; }
  #overlay .servers button b { font-family:var(--display); font-weight:400; font-size:17px; }
  #overlay .servers button small { font-size:12px; color:var(--muted); }
  #overlay .servers button.sel { background:#2f6fd6; border-color:#9cc3ff; }
  #overlay .servers button.sel small { color:#e3edff; }
  #overlay .servers button.full { opacity:0.5; cursor:not-allowed; }
  #overlay .servers button i { position:absolute; top:calc(50% - 4px); left:9px; width:8px; height:8px; border-radius:50%; background:#3ddc84; }
  #overlay .servers button i.amber { background:#ffb300; } #overlay .servers button i.red { background:#ff5252; }
  body.touch #overlay .servers button { min-width:96px; padding:5px 10px; } body.touch #overlay .servers button b { font-size:14px; }
  #overlay .srv { display:inline-flex; gap:8px; align-items:center; font-family:var(--display); font-size:17px; padding:6px 14px; border-radius:16px; background:#ffffff14; }
  #overlay .srv i { width:10px; height:10px; border-radius:50%; background:#888; display:inline-block; }
  #overlay .srv i.on { background:#4dff88; box-shadow:0 0 8px #4dff88; }
  #overlay .err { color:#ff8a8a; font-size:14px; min-height:20px; }
  .custom { display:grid; grid-template-columns:220px 1fr; gap:14px; text-align:left; align-items:start; }
  .custom canvas { width:220px; height:260px; border-radius:16px; background:radial-gradient(circle at 50% 40%, #2a3a6e, #0b1430); max-width:100%; }
  .custom .slot { margin:0 0 10px; }
  .custom .slot b { display:block; font-family:var(--display); font-weight:400; font-size:15px; color:var(--sky); margin-bottom:5px; }
  .custom .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #overlay .custom .chips button { font-family:var(--body); font-size:13px; padding:6px 11px; border-radius:14px; background:#ffffff14; box-shadow:none; border:1.5px solid #ffffff30; }
  #overlay .custom .chips button.sel { background:#2f6fd6; border-color:#9cc3ff; }
  #overlay .custom .chips button.cdot { width:36px; height:36px; padding:0; border-radius:50%; border:3px solid #ffffff40; }
  #overlay .custom .chips button.cdot.sel { border-color:#fff; box-shadow:0 0 0 3px #2f6fd6; }
  .custom.treeedit { grid-template-columns:300px 1fr; }
  @media (max-width:560px) { .custom, .custom.treeedit { grid-template-columns:1fr; } #treeCv { margin:0 auto; display:block; max-width:100%; height:auto !important; } .custom canvas { width:180px; height:200px; margin:0 auto; display:block; } }
  .langs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:0 0 10px; }
  #overlay .langs button { font-family:var(--body); font-size:14px; padding:6px 12px; border-radius:14px; background:#ffffff14; box-shadow:none; border:1.5px solid #ffffff40; }
  #overlay .langs button.sel { background:#2f6fd6; border-color:#9cc3ff; }
  .swatch { display:inline-flex; gap:6px; }
  .swatch label { width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; }
  .swatch input { position:absolute; opacity:0; width:1px; height:1px; }
  .swatch input:checked + label { border-color:#fff; }
  .swatch input:focus-visible + label { outline:3px solid var(--gold); }
  #touch { display:none; }
  .joy { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:#ffffff14; border:2px solid #ffffff40; pointer-events:none; display:none; }
  .joy i { position:absolute; left:33px; top:33px; width:50px; height:50px; border-radius:50%; background:#ffffff70; }
  #joyR { border-color:#ff8a8a80; } #joyR i { background:#ff8a8aa0; }
  #tbtns { position:fixed; right:calc(12px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:row; gap:10px; }
  #tbtns button, #camBtns button { width:58px; height:58px; border-radius:50%; border:2px solid #ffffff70; background:#ffffff22; color:#fff; font-family:var(--display); font-size:15px; touch-action:none; }
  #camBtns { position:fixed; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(136px + env(safe-area-inset-top,0px)); display:flex; gap:8px; }
  #camBtns button { width:44px; height:44px; font-size:20px; }
  body.touch #help { display:none; }
  body.touch.playing #touch { display:block; }
  body.touch #mini { width:120px; height:120px; }
  body.touch #scorebox { top:calc(186px + env(safe-area-inset-top,0px)); }
  body.touch #objective { font-size:14px; padding:5px 12px; }
  body.touch #hpbar { width:170px; height:18px; }
  body.touch #toast { font-size:28px; }
  body.touch #feed { bottom:calc(150px + env(safe-area-inset-bottom,0px)); font-size:12px; }
  body.touch #chatbox { bottom:auto; top:0; left:0; right:0; z-index:7; padding:calc(10px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) 10px max(12px, env(safe-area-inset-left,0px)); background:#0b1430f0; }
  body.touch #chatbox input { width:auto; font-size:16px; }
  body.touch #gear { display:none !important; }
  @media (max-height:520px) {
    #overlay h1 { font-size:30px; }
    #overlay h2 { font-size:13px; margin-bottom:8px; }
    #overlay .keys { font-size:12px; gap:2px 12px; }
    #overlay button { font-size:18px; padding:8px 24px; }
    #overlay input { font-size:17px; padding:6px 12px; }
    #overlay .row, .btns { margin:5px 0; }
